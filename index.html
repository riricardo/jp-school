<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fafafa"><title>Japonês Pocket</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><script defer src="./data.js"></script><script defer src="./app.js"></script></head>
<body><main><header><span>Japonês Pocket</span><button id="settingsButton" aria-label="Configurações" aria-expanded="false">⚙️</button></header>
<section id="settings" hidden><label>Modo <select id="mode"><option value="all">Misturado</option><option value="word">Palavras</option><option value="phrase">Frases</option></select></label><label><input type="checkbox" id="furigana"> Furigana sempre visível</label><label><input type="checkbox" id="romaji"> Romaji sempre visível</label><label><input type="checkbox" id="meaning"> Tradução sempre visível</label><button id="restart">Recomeçar rodada</button><button id="reset">Apagar progresso</button></section>
<section id="card" aria-live="polite"><small id="kind"></small><div id="japanese" lang="ja"></div><p id="romajiText" hidden></p><p id="meaningText" hidden></p><div id="reveal"><button id="showKana" aria-label="Mostrar furigana">あ</button><button id="showRomaji" aria-label="Mostrar romaji">ABC</button><button id="showMeaning" aria-label="Mostrar tradução">PT</button></div></section>
<footer><div id="answers"><button id="no" aria-label="Não sei">❌</button><button id="yes" aria-label="Sei">✅</button></div><p id="progress"></p><small id="offline">Offline disponível após abrir pelo GitHub Pages.</small><p id="storageWarning" hidden>O navegador não permitiu salvar: o progresso vale só nesta sessão.</p></footer></main></body></html>
